name: Deploy production site to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate tracked production artifacts
        run: npm run check
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Confirm production base URL
        run: npm run check:site:base-url -- --actual "${{ steps.pages.outputs.base_url }}"
      - name: Upload production site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site/production

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
